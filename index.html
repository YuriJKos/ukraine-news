<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UKR WIRE | Ukraine war news</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--ink:#182534;--muted:#667481;--accent:#0f5e78;--paper:#f5f7f8}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.masthead{border-bottom:4px solid #f3c530}
.eyebrow{color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.1em}
.article-card{border:0;box-shadow:0 1px 3px rgb(15 31 43 / 10%)}
.headline{font-size:1.1rem;font-weight:700;line-height:1.35}
.metadata{color:var(--muted);font-size:.85rem}
.publisher{background:#e4f1f4;color:#15566c;font-size:.76rem;font-weight:700}
.summary{color:#40505d;font-size:.94rem}
</style>
</head>
<body>
<header class="masthead bg-white">
  <div class="container py-4">
    <p class="eyebrow mb-1">UKR WIRE</p>
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3">
      <div>
        <h1 class="h2 mb-1">Ukraine war news</h1>
        <p class="mb-0 text-secondary">Headlines published in the past 24 hours, newest first.</p>
      </div>
      <button id="refresh" class="btn btn-primary" type="button">Refresh headlines</button>
    </div>
  </div>
</header>

<main class="container py-4 pb-5">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <p id="status" class="metadata mb-0" aria-live="polite">Loading latest headlines&hellip;</p>
    <button id="retry" class="btn btn-sm btn-outline-secondary d-none" type="button">Try again</button>
    <label class="visually-hidden" for="search">Filter headlines</label>
    <input id="search" class="form-control form-control-sm" style="max-width:20rem" type="search" placeholder="Filter headlines or publishers" autocomplete="off">
  </div>

  <div id="news" class="vstack gap-3"></div>

  <p class="metadata mt-4 mb-1">Headlines are aggregated from Google News RSS. Follow the article link for the original reporting; aggregation does not independently verify claims.</p>
  <p id="stamp" class="metadata mb-0"></p>
</main>

<script>
(function () {
  "use strict";

  var DATA_URL = "news.json";
  var STALE_HOURS = 6;

  var news = document.getElementById("news");
  var status = document.getElementById("status");
  var search = document.getElementById("search");
  var refresh = document.getElementById("refresh");
  var retry = document.getElementById("retry");
  var stamp = document.getElementById("stamp");

  var articles = [];
  var loaded = false;

  function setStatus(text, isError) {
    status.textContent = text;
    status.classList.toggle("text-danger", !!isError);
  }

  function relTime(ms) {
    var mins = Math.round(Math.abs(ms) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }

  function message(text) {
    news.replaceChildren();
    var p = document.createElement("p");
    p.className = "text-secondary mb-0";
    p.textContent = text;
    news.append(p);
  }

  function render() {
    var term = search.value.trim().toLowerCase();
    var visible = articles.filter(function (a) {
      return !term || (a.headline + " " + a.publisher).toLowerCase().indexOf(term) !== -1;
    });

    news.replaceChildren();

    if (!visible.length) {
      message(articles.length ? "No headlines match that filter." : "No recent headlines were returned.");
      return;
    }

    var frag = document.createDocumentFragment();
    visible.forEach(function (a) {
      var card = document.createElement("article");
      card.className = "card article-card";

      var body = document.createElement("div");
      body.className = "card-body p-3 p-md-4";

      var tag = document.createElement("span");
      tag.className = "badge rounded-pill publisher mb-2";
      tag.textContent = a.publisher;

      var title = document.createElement("h2");
      title.className = "headline h5 mb-2";
      title.textContent = a.headline;

      var time = document.createElement("p");
      time.className = "metadata mb-2";
      time.textContent = a.date.toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });

      var link = document.createElement("a");
      link.href = a.link;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Read full article \u2192";

      body.append(tag, title, time);
      if (a.summary) {
        var p = document.createElement("p");
        p.className = "summary mb-3";
        p.textContent = a.summary;
        body.append(p);
      }
      body.append(link);
      card.append(body);
      frag.append(card);
    });

    news.append(frag);
  }

  function showFailure(err) {
    console.error(err);
    loaded = false;
    retry.classList.remove("d-none");
    setStatus("Could not load headlines.", true);
    news.replaceChildren();

    var box = document.createElement("div");
    box.className = "alert alert-warning mb-0";
    box.textContent = "The headlines file could not be loaded. Press \u201cTry again\u201d in a moment.";
    news.append(box);
  }

  function load() {
    setStatus("Loading latest headlines\u2026");
    retry.classList.add("d-none");
    stamp.textContent = "";

    fetch(DATA_URL + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("news.json returned HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var items = Array.isArray(data) ? data : (data.items || []);
        articles = items
          .map(function (x) {
            var d = new Date(x.date || x.pubDate);
            return {
              headline: String(x.headline || x.title || "Untitled article"),
              publisher: String(x.publisher || "News source"),
              summary: x.summary ? String(x.summary) : "",
              link: x.link || "",
              date: d
            };
          })
          .filter(function (x) { return !Number.isNaN(x.date.valueOf()); })
          .sort(function (a, b) { return b.date - a.date; });

        loaded = true;

        if (!articles.length) {
          setStatus("No headlines in the past 24 hours.");
          message("No recent headlines were returned.");
          return;
        }

        setStatus(articles.length + " headlines \u00b7 updated " + new Date().toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short"
        }));

        var gen = data && data.generatedAt ? new Date(data.generatedAt) : null;
        if (gen && !Number.isNaN(gen.valueOf())) {
          var ageHours = (Date.now() - gen.valueOf()) / 3600000;
          stamp.textContent = "Feed generated " + relTime(Date.now() - gen.valueOf()) + ".";
          if (ageHours > STALE_HOURS) {
            stamp.textContent += " The feed looks stale \u2014 the scheduled update may have stopped.";
            stamp.className = "metadata mb-0 text-danger";
          } else {
            stamp.className = "metadata mb-0";
          }
        }

        render();
      })
      .catch(showFailure);
  }

  refresh.addEventListener("click", load);
  retry.addEventListener("click", load);
  search.addEventListener("input", function () {
    if (loaded) render();
  });

  load();
})();
</script>
</body>
</html>
