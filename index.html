<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UKR WIRE | Ukraine war news</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:root{--ink:#182534;--muted:#667481;--accent:#0f5e78;--paper:#f5f7f8}body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.masthead{border-bottom:4px solid #f3c530}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.1em}.article-card{border:0;box-shadow:0 1px 3px rgb(15 31 43 / 10%)}.headline{font-size:1.1rem;font-weight:700;line-height:1.35}.metadata{color:var(--muted);font-size:.85rem}.publisher{background:#e4f1f4;color:#15566c;font-size:.76rem;font-weight:700}.summary{color:#40505d;font-size:.94rem}</style></head>
<body><header class="masthead bg-white"><div class="container py-4"><p class="eyebrow mb-1">UKR WIRE</p><div class="d-flex flex-wrap align-items-end justify-content-between gap-3"><div><h1 class="h2 mb-1">Ukraine war news</h1><p class="mb-0 text-secondary">Headlines published in the past 24 hours, newest first.</p></div><button id="refresh" class="btn btn-primary">Refresh headlines</button></div></div></header><main class="container py-4 pb-5"><div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3"><p id="status" class="metadata mb-0" aria-live="polite">Loading latest headlines…</p><label class="visually-hidden" for="search">Filter headlines</label><input id="search" class="form-control form-control-sm" style="max-width:20rem" type="search" placeholder="Filter headlines or publishers"></div><div id="news" class="vstack gap-3"></div><p class="metadata mt-4 mb-0">Headlines are aggregated from Google News RSS. Follow the article link for the original reporting; aggregation does not independently verify claims.</p></main>
<script>
const rssUrl="https://news.google.com/rss/search?q=ukraine+russia+war+when:1d&hl=en-US&gl=US&ceid=US:en",apiUrl="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(rssUrl),news=document.getElementById("news"),status=document.getElementById("status"),search=document.getElementById("search");let articles=[];
function details(title){const i=title.lastIndexOf(" - ");return i>0?{headline:title.slice(0,i),publisher:title.slice(i+3)}:{headline:title,publisher:"News source"}}
function text(html){const e=document.createElement("div");e.innerHTML=html||"";return e.textContent.trim().replace(/\s+/g," ")}
function render(){const term=search.value.trim().toLowerCase(),visible=articles.filter(a=>!term||(a.headline+" "+a.publisher).toLowerCase().includes(term));news.replaceChildren();if(!visible.length){const p=document.createElement("p");p.className="text-secondary mb-0";p.textContent=articles.length?"No headlines match that filter.":"No recent headlines were returned.";news.append(p);return}visible.forEach(a=>{const card=document.createElement("article"),body=document.createElement("div"),tag=document.createElement("span"),title=document.createElement("h2"),time=document.createElement("p"),link=document.createElement("a");card.className="card article-card";body.className="card-body p-3 p-md-4";tag.className="badge rounded-pill publisher mb-2";tag.textContent=a.publisher;title.className="headline h5 mb-2";title.textContent=a.headline;time.className="metadata mb-2";time.textContent=a.date.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});link.href=a.link;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Read full article →";body.append(tag,title,time);if(a.summary){const p=document.createElement("p");p.className="summary mb-3";p.textContent=a.summary;body.append(p)}body.append(link);card.append(body);news.append(card)})}
async function fetchNews(){status.textContent="Loading latest headlines…";news.replaceChildren();try{const r=await fetch(apiUrl);if(!r.ok)throw Error("Unable to reach RSS service");const d=await r.json();articles=(d.items||[]).map(x=>({...details(x.title||"Untitled article"),date:new Date(x.pubDate),link:x.link,summary:text(x.description).slice(0,260)})).filter(x=>!Number.isNaN(x.date.valueOf())).sort((a,b)=>b.date-a.date).slice(0,10);status.textContent=articles.length+" headlines · Updated "+new Date().toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+" ("+Intl.DateTimeFormat().resolvedOptions().timeZone+")";render()}catch(e){console.error(e);status.textContent="Could not load headlines.";const d=document.createElement("div");d.className="alert alert-warning mb-0";d.textContent="The news service is temporarily unavailable. Please refresh in a moment.";news.append(d)}}
document.getElementById("refresh").addEventListener("click",fetchNews);search.addEventListener("input",render);fetchNews();
</script></body></html>
