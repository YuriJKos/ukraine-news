<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukraine War News (Last 24 Hours)</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f5f0e8; font-family: Georgia, serif; }
.card { margin-bottom:20px; }
.headline { font-weight:600; font-size:1.1rem; }
.source { font-size:0.8rem; color:#666; }
</style>
</head>
<body>

<div class="container py-4">
    <h2>Ukraine War News (Last 24 Hours)</h2>
    <button onclick="fetchNews()" class="btn btn-danger mb-3">Refresh</button>
    <div id="news"></div>
</div>

<script>
async function fetchNews() {
    const container = document.getElementById("news");
    container.innerHTML = "<p>Loading latest news...</p>";

    const rssUrl =
      "https://news.google.com/rss/search?q=ukraine+russia+war+when:1d&hl=en-US&gl=US&ceid=US:en";

    // More reliable than AllOrigins, which frequently fails or is rate-limited.
    const apiUrl =
      "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);

    try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Unable to reach RSS service");

        const data = await response.json();

        if (!data.items || data.items.length === 0) {
            container.innerHTML = "<p>No recent articles found.</p>";
            return;
        }

        container.innerHTML = "";

        data.items.slice(0, 10).forEach(article => {
            const div = document.createElement("div");
            div.className = "card p-3";

            const date = article.pubDate
                ? new Date(article.pubDate).toLocaleString()
                : "Date unknown";

            div.innerHTML = `
                <div class="headline">${article.title}</div>
                <div class="source">${article.author || "News Source"} · ${date}</div>
                <a href="${article.link}" target="_blank" rel="noopener noreferrer">
                    Read full article →
                </a>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        console.error(err);
        container.innerHTML = `
            <div class="alert alert-warning">
                Failed to load news.<br>
                Open the browser console (F12) to see the exact error.
            </div>`;
    }
}

fetchNews();
</script>

</body>
</html>
