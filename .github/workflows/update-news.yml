name: Update headlines

on:
  schedule:
    # Every 30 minutes. GitHub may delay this slightly under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["news.json", "README.md"]

permissions:
  contents: write

concurrency:
  group: update-headlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Google News RSS
        run: node scripts/fetch-news.mjs

      - name: Commit news.json if it changed
        run: |
          if [ -z "$(git status --porcelain news.json)" ]; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update headlines"
          git push
